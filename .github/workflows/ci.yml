name: CI — Build & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Make build ──────────────────────────────────────────────────────
  make-linux:
    name: Make — Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lib
      - run: make test

  make-macos:
    name: Make — macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lib
      - run: make test

  # ── ARM Cortex-M0 size benchmark (keeps bench/ building) ────────────
  # Ubuntu's newlib has speed-optimized memcpy/memset, so ELF totals run
  # ~310 B above docs/design/size-comparison.md (Arm GNU toolchain);
  # stack-only code is identical.
  arm-size:
    name: ARM Size — Cortex-M0 (UDP, UDP+TCP, UDP+mDNS, UDP+HTTP, dual stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Arm GNU toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build and measure
        run: |
          set -o pipefail
          make arm-size     | tee /tmp/arm-size.out
          make arm-size-tcp | tee -a /tmp/arm-size.out
          make arm-size-mdns | tee -a /tmp/arm-size.out
          make arm-size-http | tee -a /tmp/arm-size.out
          make arm-size-ipv6 | tee -a /tmp/arm-size.out
      - name: Size summary
        if: always()
        run: |
          echo "## ARM Cortex-M0 Size" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -A2 '^===.*Size' /tmp/arm-size.out >> "$GITHUB_STEP_SUMMARY" \
            || echo "(no output captured)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── CMake build ─────────────────────────────────────────────────────
  cmake-linux:
    name: CMake — Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # ctest runs unprivileged, so test_rawsock skips its live tests there.
      - name: Raw-socket driver live tests (root, veth pair)
        run: sudo ./build/tests/test_rawsock

  cmake-macos:
    name: CMake — macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ── Blackbox conformance tests (Linux, once per MAC driver) ──────────
  # tap: the SUT opens tap0.  raw: the SUT opens veth-sut with the
  # raw-socket (AF_PACKET) driver, the harness uses the peer veth-test.
  # tests/blackbox/sut_net.sh builds either link and exports TEST_IF (the
  # harness end) and SUT_IF (the demo's interface argument).
  blackbox-linux:
    name: Blackbox — Full Conformance (ARP/IPv4/ICMP/UDP/TCP, ${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: cmake-linux           # reuse the already-validated build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: tap, label: TAP }
          - { driver: raw, label: raw socket }
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip iproute2 iputils-arping netcat-openbsd

      - name: Install Python deps
        run: |
          sudo pip3 install --break-system-packages \
            -r tests/blackbox/requirements.txt \
            pytest-github-actions-annotate-failures

      - name: Build tcp_echo_demo (universal SUT)
        run: |
          cmake -S . -B build
          cmake --build build --target tcp_echo_demo

      - name: Set up the SUT link (${{ matrix.label }})
        run: |
          set -o pipefail
          # --rst-drop: drop RSTs generated by the kernel for the phantom IP
          # (10.0.0.100).  Because 10.0.0.100 IS assigned to the harness end,
          # the kernel sees the SUT's SYN-ACK replies and auto-RSTs them (no
          # listening socket for the ephemeral source ports used by Scapy).
          # This RST arrives at the SUT before our ACK, sending it back to
          # LISTEN and breaking all tests that require an established
          # connection.  The rule is scoped to the harness end, so the SUT's
          # own RSTs (sport=7 → dport=ephemeral) stay intact and tests like
          # test_tcp_031 and test_tcp_072 can capture them.
          sudo tests/blackbox/sut_net.sh up ${{ matrix.driver }} --rst-drop \
            | tee -a "$GITHUB_ENV"

      - name: Start SUT
        run: |
          sudo ./build/demo/tcp_echo_demo "$SUT_IF" > /tmp/sut.log 2>&1 &
          echo $! > /tmp/sut.pid
          sleep 1

      - name: Linux kernel sanity checks (validates interop with production stack)
        run: |
          echo "=== ARP sanity (arping) ==="
          sudo arping -I "$TEST_IF" -c 3 -w 5 10.0.0.2
          echo "=== ICMP sanity (ping) ==="
          ping -c 3 -W 2 -I "$TEST_IF" 10.0.0.2
          echo "=== TCP sanity (nc) ==="
          echo "hello_tcp" | nc -w 2 10.0.0.2 7 | grep -q "hello_tcp"
          echo "=== UDP sanity (nc -u) ==="
          echo "hello_udp" | nc -u -w 1 10.0.0.2 7 || true  # best-effort
          echo "All Linux sanity checks passed."

      - name: Run full Scapy conformance suite
        run: |
          chmod +x tests/blackbox/run_blackbox.sh
          # SUT and link are already up; pass --no-start-sut so the script
          # doesn't launch a second competing SUT process.
          sudo tests/blackbox/run_blackbox.sh \
            --sut-bin   ./build/demo/tcp_echo_demo \
            --iface     "$TEST_IF"                 \
            --sut-iface "$SUT_IF"                  \
            --sut-ip    10.0.0.2                   \
            --our-ip    10.0.0.100                 \
            --sut-port  7                          \
            --no-start-sut                         \
            -v                                     \
            2>&1 | tee /tmp/blackbox.out
          exit ${PIPESTATUS[0]}

      - name: Dump SUT log on failure
        if: failure()
        run: |
          echo "=== SUT stdout/stderr (/tmp/sut.log) ==="
          cat /tmp/sut.log 2>/dev/null || echo "(no sut.log found)"

      - name: Stop SUT and tear down the link
        if: always()
        run: |
          [ -f /tmp/sut.pid ] && sudo kill $(cat /tmp/sut.pid) 2>/dev/null || true
          sudo tests/blackbox/sut_net.sh down ${{ matrix.driver }}

      - name: Blackbox results summary
        if: always()
        run: |
          echo "## Blackbox Conformance Output (${{ matrix.label }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -c 12000 /tmp/blackbox.out >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "(no output captured)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── IPv6 / ICMPv6 / NDP blackbox tests (Linux, once per MAC driver) ──
  # The suite launches a fresh dual-stack tcp_echo_demo per test (the DAD
  # probe at start-up is under test), so no SUT is started here.
  blackbox-ipv6:
    name: Blackbox — IPv6, SLAAC, DHCPv6 (tcp_echo_demo, ${{ matrix.label }}) + dnsmasq interop
    runs-on: ubuntu-latest
    needs: cmake-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: tap, label: TAP }
          - { driver: raw, label: raw socket }
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip iproute2 iputils-ping dnsmasq-base

      - name: Install Python deps
        run: |
          sudo pip3 install --break-system-packages \
            -r tests/blackbox/requirements.txt \
            pytest-github-actions-annotate-failures

      - name: Build tcp_echo_demo (dual stack)
        run: |
          cmake -S . -B build
          cmake --build build --target tcp_echo_demo

      - name: Set up the SUT link (${{ matrix.label }})
        run: |
          set -o pipefail
          sudo tests/blackbox/sut_net.sh up ${{ matrix.driver }} | tee -a "$GITHUB_ENV"

      - name: Run IPv6 conformance suite
        run: |
          set -o pipefail
          sudo python3 -m pytest tests/blackbox/test_ipv6_conform.py \
            --iface        "$TEST_IF"                  \
            --sut-iface    "$SUT_IF"                   \
            --ipv6-sut-bin ./build/demo/tcp_echo_demo  \
            -p no:cacheprovider --tb=short -v -rs      \
            2>&1 | tee /tmp/ipv6_blackbox.out

      # A real router + DHCPv6 server: dnsmasq's RA (M flag) makes the demo
      # lease an address over DHCPv6; the host pings it and connects to it.
      - name: DHCPv6 interop (dnsmasq)
        run: |
          set -o pipefail
          sudo tests/blackbox/dhcpv6_interop.sh ./build/demo/tcp_echo_demo \
            "$SUT_IF" "$TEST_IF" 2>&1 | tee -a /tmp/ipv6_blackbox.out

      - name: Tear down the link
        if: always()
        run: |
          sudo pkill -x tcp_echo_demo 2>/dev/null || true
          sudo tests/blackbox/sut_net.sh down ${{ matrix.driver }}

      - name: IPv6 results summary
        if: always()
        run: |
          echo "## IPv6 Blackbox Output (${{ matrix.label }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -c 12000 /tmp/ipv6_blackbox.out >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "(no output captured)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── Blackbox validation: run same tests against Linux kernel reference SUT ──
  # If a test FAILS here, the test itself is wrong (not our stack).
  # If a test PASSES here but FAILS in blackbox-linux, our SUT has a bug.
  blackbox-validate:
    name: Blackbox — Validate Tests Against Linux Kernel (Reference SUT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip iproute2 socat

      - name: Install Python deps
        run: |
          sudo pip3 install --break-system-packages \
            -r tests/blackbox/requirements.txt \
            pytest-github-actions-annotate-failures

      - name: Set up veth pair + Linux reference SUT (kernel owns 10.0.0.2)
        run: |
          # Use a veth pair so scapy (on veth-test) can see ARP replies from
          # the kernel (on veth-sut).  A plain tap0 does not work here because
          # the kernel's TX frames go to the tap fd, not back to AF_PACKET.
          sudo ip link add veth-sut type veth peer name veth-test
          sudo ip link set veth-sut up
          sudo ip link set veth-test up
          sudo ip addr add 10.0.0.2/24 dev veth-sut   # Linux kernel IS the SUT
          # Drop RSTs generated by the test-harness side only (veth-test).
          # Without this, the kernel auto-RSTs Scapy's phantom connections when
          # SYN-ACK arrives for 10.0.0.100 (not assigned to any local interface).
          # Scoping to -o veth-test leaves the SUT's own RSTs (on veth-sut) intact
          # so tests like test_tcp_031 and test_tcp_072 can capture them.
          sudo iptables -A OUTPUT -p tcp --tcp-flags RST RST -o veth-test -j DROP
          # TCP echo: socat works fine for stream sockets.
          sudo socat TCP-LISTEN:7,bind=10.0.0.2,fork,reuseaddr EXEC:'cat' &
          # UDP echo: socat EXEC:'cat' buffers (non-tty stdout is line-buffered
          # and cat never flushes), so datagrams are silently swallowed.
          # Single-line Python avoids YAML block-scalar indentation issues.
          sudo python3 -c "import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1); s.bind(('10.0.0.2',7)); exec('while 1:\n d,a=s.recvfrom(65535)\n s.sendto(d,a)')" &
          # Add a permanent neighbor entry for 10.0.0.100 (scapy phantom IP).
          # The kernel's ARP cache for a phantom IP expires ~15–30 s after the
          # initial ARP handshake.  Once it enters PROBE/FAILED the kernel can
          # no longer send ICMP/TCP/UDP replies to 10.0.0.100, causing all
          # response-based tests to fail.  A permanent entry never expires.
          OUR_MAC=$(cat /sys/class/net/veth-test/address)
          sudo ip neigh add 10.0.0.100 lladdr "$OUR_MAC" dev veth-sut nud permanent
          sleep 0.5

      - name: Run conformance suite against Linux reference SUT
        run: |
          # Skip sut_specific tests — they depend on our stack's timer values,
          # not on RFC correctness.  A failure here means the TEST is wrong.
          # Also skip the DHCPv4, mDNS, HTTP and IPv6 suites — they launch
          # their own demo SUTs, not the kernel.
          sudo python3 -m pytest tests/blackbox/ \
            --ignore=tests/blackbox/test_tcp_fuzz.py \
            --ignore=tests/blackbox/test_dhcpv4_conform.py \
            --ignore=tests/blackbox/test_mdns_conform.py \
            --ignore=tests/blackbox/test_http_conform.py \
            --ignore=tests/blackbox/test_ipv6_conform.py \
            --iface    veth-test \
            --sut-ip   10.0.0.2 \
            --our-ip   10.0.0.100 \
            --sut-port 7 \
            -m "not sut_specific" \
            -v \
            2>&1 | tee /tmp/validate.out
          exit ${PIPESTATUS[0]}

      - name: Teardown
        if: always()
        run: |
          sudo iptables -D OUTPUT -p tcp --tcp-flags RST RST -o veth-test -j DROP 2>/dev/null || true
          sudo ip link del veth-sut 2>/dev/null || true   # deletes both ends

      - name: Validation results summary
        if: always()
        run: |
          echo "## Reference-SUT Validation Output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -c 12000 /tmp/validate.out >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "(no output captured)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── DHCP client blackbox tests (Linux, once per MAC driver) ─────────
  blackbox-dhcp:
    name: Blackbox — DHCPv4 Client Conformance (dhcp_echo_demo, ${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: cmake-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: tap, label: TAP }
          - { driver: raw, label: raw socket }
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip iproute2

      - name: Install Python deps
        run: |
          sudo pip3 install --break-system-packages \
            -r tests/blackbox/requirements.txt \
            pytest-github-actions-annotate-failures

      - name: Build dhcp_echo_demo
        run: |
          cmake -S . -B build
          cmake --build build --target dhcp_echo_demo

      - name: Set up the SUT link (${{ matrix.label }})
        run: |
          set -o pipefail
          sudo tests/blackbox/sut_net.sh up ${{ matrix.driver }} | tee -a "$GITHUB_ENV"

      - name: Start DHCP SUT (dhcp_echo_demo)
        run: |
          sudo ./build/demo/dhcp_echo_demo "$SUT_IF" > /tmp/dhcp_sut.log 2>&1 &
          echo $! > /tmp/dhcp_sut.pid
          sleep 1

      - name: Run DHCP client conformance suite
        run: |
          # --dhcp-sut-bin activates the dhcp_sut_fresh fixture which kills and
          # restarts dhcp_echo_demo before each test.  Without this, after the
          # first test_ack_binds_ip the SUT holds a bound IP and never sends
          # DISCOVER again, causing all subsequent tests to time out.
          sudo python3 -m pytest tests/blackbox/test_dhcpv4_conform.py \
            --iface           "$TEST_IF"                      \
            --sut-iface       "$SUT_IF"                       \
            --our-ip          10.0.0.100                     \
            --dhcp-sut-mac    02:00:00:de:ad:01               \
            --dhcp-server-ip  10.0.0.1                        \
            --dhcp-offered-ip 10.0.0.50                       \
            --dhcp-sut-bin    ./build/demo/dhcp_echo_demo     \
            --dhcp-sut-pid-file /tmp/dhcp_sut.pid             \
            -p no:cacheprovider                               \
            --tb=short -v                                     \
            2>&1 | tee /tmp/dhcp_blackbox.out
          exit ${PIPESTATUS[0]}

      - name: Stop DHCP SUT and tear down the link
        if: always()
        run: |
          [ -f /tmp/dhcp_sut.pid ] && sudo kill $(cat /tmp/dhcp_sut.pid) 2>/dev/null || true
          sudo pkill -x dhcp_echo_demo 2>/dev/null || true
          sudo tests/blackbox/sut_net.sh down ${{ matrix.driver }}

      - name: DHCP results summary
        if: always()
        run: |
          echo "## DHCP Blackbox Output (${{ matrix.label }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -c 12000 /tmp/dhcp_blackbox.out >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "(no output captured)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── mDNS + DNS-SD blackbox tests (Linux, once per MAC driver) ───────
  blackbox-mdns:
    name: Blackbox — mDNS + DNS-SD (mdns_demo, ${{ matrix.label }}) + Avahi interop
    runs-on: ubuntu-latest
    needs: cmake-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: tap, label: TAP }
          - { driver: raw, label: raw socket }
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip iproute2 netcat-openbsd

      - name: Install Python deps
        run: |
          sudo pip3 install --break-system-packages \
            -r tests/blackbox/requirements.txt \
            pytest-github-actions-annotate-failures

      - name: Build mdns_demo
        run: |
          cmake -S . -B build
          cmake --build build --target mdns_demo

      - name: Set up the SUT link (${{ matrix.label }})
        run: |
          set -o pipefail
          sudo tests/blackbox/sut_net.sh up ${{ matrix.driver }} | tee -a "$GITHUB_ENV"

      # The tests start a fresh SUT per test (probing/announcing/goodbye are
      # start-up and shutdown behaviour), so no SUT is started here.
      - name: Run mDNS conformance suite
        run: |
          set -o pipefail
          sudo python3 -m pytest tests/blackbox/test_mdns_conform.py \
            --iface        "$TEST_IF"             \
            --sut-iface    "$SUT_IF"              \
            --sut-ip       10.0.0.2               \
            --our-ip       10.0.0.100             \
            --mdns-sut-bin ./build/demo/mdns_demo \
            -p no:cacheprovider --tb=short -v     \
            2>&1 | tee /tmp/mdns_blackbox.out

      # After the Scapy suite so Avahi's own traffic cannot interfere.
      - name: Avahi interop (resolve + browse the demo)
        run: |
          set -o pipefail
          sudo apt-get install -y --no-install-recommends avahi-daemon avahi-utils
          sudo sed -i "s/^#\?allow-interfaces=.*/allow-interfaces=$TEST_IF/; s/^use-ipv6=.*/use-ipv6=yes/" \
            /etc/avahi/avahi-daemon.conf
          sudo systemctl restart avahi-daemon
          sleep 2
          sudo tests/blackbox/mdns_interop.sh ./build/demo/mdns_demo "$SUT_IF" \
            2>&1 | tee -a /tmp/mdns_blackbox.out

      - name: Tear down the link
        if: always()
        run: |
          sudo pkill -x mdns_demo 2>/dev/null || true
          sudo tests/blackbox/sut_net.sh down ${{ matrix.driver }}

      - name: mDNS results summary
        if: always()
        run: |
          echo "## mDNS Blackbox Output (${{ matrix.label }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -c 12000 /tmp/mdns_blackbox.out >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "(no output captured)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── HTTP server blackbox tests (Linux, once per MAC driver) ─────────
  # With the raw socket, every segment from the kernel client arrives with a
  # partial (offloaded) checksum that the driver must complete.
  blackbox-http:
    name: Blackbox — HTTP server (http_demo, ${{ matrix.label }}) + browse-by-name interop
    runs-on: ubuntu-latest
    needs: cmake-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: tap, label: TAP }
          - { driver: raw, label: raw socket }
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip iproute2 curl

      - name: Install Python deps
        run: |
          sudo pip3 install --break-system-packages \
            -r tests/blackbox/requirements.txt \
            pytest-github-actions-annotate-failures

      - name: Build http_demo
        run: |
          cmake -S . -B build
          cmake --build build --target http_demo

      # No --rst-drop here: the host kernel is a real TCP client of the
      # SUT, so it must be able to reset its own connections.
      - name: Set up the SUT link (${{ matrix.label }})
        run: |
          set -o pipefail
          sudo tests/blackbox/sut_net.sh up ${{ matrix.driver }} | tee -a "$GITHUB_ENV"

      - name: Run HTTP conformance suite
        run: |
          set -o pipefail
          sudo python3 -m pytest tests/blackbox/test_http_conform.py \
            --iface        "$TEST_IF"             \
            --sut-iface    "$SUT_IF"              \
            --sut-ip       10.0.0.2               \
            --http-sut-bin ./build/demo/http_demo \
            -p no:cacheprovider --tb=short -v     \
            2>&1 | tee /tmp/http_blackbox.out

      # Avahi discovers _http._tcp and nss-mdns resolves pyro-dead01.local
      # for curl — the "browse to the device by name" goal end to end.
      - name: Browse by name (Avahi + nss-mdns + curl)
        run: |
          set -o pipefail
          sudo apt-get install -y --no-install-recommends \
            avahi-daemon avahi-utils libnss-mdns
          sudo sed -i "s/^#\?allow-interfaces=.*/allow-interfaces=$TEST_IF/; s/^use-ipv6=.*/use-ipv6=yes/" \
            /etc/avahi/avahi-daemon.conf
          sudo systemctl restart avahi-daemon
          sleep 2
          grep '^hosts' /etc/nsswitch.conf
          sudo tests/blackbox/http_interop.sh ./build/demo/http_demo "$SUT_IF" "$TEST_IF" \
            2>&1 | tee -a /tmp/http_blackbox.out

      - name: Tear down the link
        if: always()
        run: |
          sudo pkill -x http_demo 2>/dev/null || true
          sudo tests/blackbox/sut_net.sh down ${{ matrix.driver }}

      - name: HTTP results summary
        if: always()
        run: |
          echo "## HTTP Blackbox Output (${{ matrix.label }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -c 12000 /tmp/http_blackbox.out >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "(no output captured)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── TLS 1.3 blackbox tests (Linux, once per MAC driver) ─────────────
  # smallest_tcp's TLS 1.3 over its own TCP, Mbed TLS for the crypto:
  # tls_echo_demo against Python ssl and openssl s_client, tls_client_demo
  # against Python ssl and openssl s_server, https_demo against Python
  # and curl.
  blackbox-tls:
    name: Blackbox — TLS 1.3 server + client + HTTPS (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: cmake-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: tap, label: TAP }
          - { driver: raw, label: raw socket }
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip iproute2 openssl curl

      - name: Install Python deps
        run: |
          sudo pip3 install --break-system-packages \
            -r tests/blackbox/requirements.txt \
            pytest-github-actions-annotate-failures

      - name: Build the TLS demos
        run: |
          cmake -S . -B build
          cmake --build build --target tls_echo_demo tls_client_demo https_demo

      - name: Set up the SUT link (${{ matrix.label }})
        run: |
          set -o pipefail
          sudo tests/blackbox/sut_net.sh up ${{ matrix.driver }} | tee -a "$GITHUB_ENV"

      - name: Run TLS conformance suite
        run: |
          set -o pipefail
          openssl version
          sudo python3 -m pytest tests/blackbox/test_tls_conform.py \
            tests/blackbox/test_tls_client_conform.py      \
            tests/blackbox/test_https_conform.py           \
            --iface          "$TEST_IF"                    \
            --sut-iface      "$SUT_IF"                     \
            --sut-ip         10.0.0.2                      \
            --our-ip         10.0.0.100                    \
            --tls-sut-bin    ./build/demo/tls_echo_demo    \
            --tls-client-bin ./build/demo/tls_client_demo  \
            --https-sut-bin  ./build/demo/https_demo       \
            -p no:cacheprovider --tb=short -v              \
            2>&1 | tee /tmp/tls_blackbox.out

      - name: Tear down the link
        if: always()
        run: |
          sudo pkill -x tls_echo_demo 2>/dev/null || true
          sudo pkill -x tls_client_demo 2>/dev/null || true
          sudo pkill -x https_demo 2>/dev/null || true
          sudo tests/blackbox/sut_net.sh down ${{ matrix.driver }}

      - name: TLS results summary
        if: always()
        run: |
          echo "## TLS Blackbox Output (${{ matrix.label }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -c 12000 /tmp/tls_blackbox.out >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "(no output captured)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── FetchContent integration test ───────────────────────────────────
  fetchcontent:
    name: FetchContent — Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure example consumer
        run: cmake -S examples/fetchcontent -B examples/fetchcontent/build
      - name: Build example consumer
        run: cmake --build examples/fetchcontent/build
      - name: Run example
        run: ./examples/fetchcontent/build/example_app
