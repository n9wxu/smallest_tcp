name: CI — Build & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Make build ──────────────────────────────────────────────────────
  make-linux:
    name: Make — Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lib
      - run: make test

  make-macos:
    name: Make — macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lib
      - run: make test

  # ── CMake build ─────────────────────────────────────────────────────
  cmake-linux:
    name: CMake — Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  cmake-macos:
    name: CMake — macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ── Blackbox conformance tests (TAP, Linux only) ───────────────────
  blackbox-linux:
    name: Blackbox — Full Conformance (ARP/IPv4/ICMP/UDP/TCP, TAP)
    runs-on: ubuntu-latest
    needs: cmake-linux           # reuse the already-validated build
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip iproute2 iputils-arping netcat-openbsd

      - name: Install Python deps
        run: |
          sudo pip3 install --break-system-packages \
            -r tests/blackbox/requirements.txt \
            pytest-github-actions-annotate-failures

      - name: Build tcp_echo_demo (universal SUT)
        run: |
          cmake -S . -B build
          cmake --build build --target tcp_echo_demo

      - name: Set up TAP interface
        run: |
          sudo ip tuntap add dev tap0 mode tap user $(whoami)
          sudo ip link set tap0 up
          sudo ip addr add 10.0.0.100/24 dev tap0

      - name: Start SUT
        run: |
          sudo ./build/demo/tcp_echo_demo > /tmp/sut.log 2>&1 &
          echo $! > /tmp/sut.pid
          sleep 1

      - name: Linux kernel sanity checks (validates interop with production stack)
        run: |
          echo "=== ARP sanity (arping) ==="
          sudo arping -I tap0 -c 3 -w 5 10.0.0.2
          echo "=== ICMP sanity (ping) ==="
          ping -c 3 -W 2 -I tap0 10.0.0.2
          echo "=== TCP sanity (nc) ==="
          echo "hello_tcp" | nc -w 2 10.0.0.2 7 | grep -q "hello_tcp"
          echo "=== UDP sanity (nc -u) ==="
          echo "hello_udp" | nc -u -w 1 10.0.0.2 7 || true  # best-effort
          echo "All Linux sanity checks passed."

      - name: Run full Scapy conformance suite
        run: |
          chmod +x tests/blackbox/run_blackbox.sh
          # SUT and TAP are already up; pass --no-start-sut so the script
          # doesn't launch a second competing SUT process.
          sudo tests/blackbox/run_blackbox.sh \
            --sut-bin  ./build/demo/tcp_echo_demo \
            --iface    tap0                        \
            --sut-ip   10.0.0.2                    \
            --our-ip   10.0.0.100                  \
            --sut-port 7                           \
            --no-start-sut                         \
            -v                                     \
            2>&1 | tee /tmp/blackbox.out
          exit ${PIPESTATUS[0]}

      - name: Stop SUT and teardown TAP
        if: always()
        run: |
          [ -f /tmp/sut.pid ] && sudo kill $(cat /tmp/sut.pid) 2>/dev/null || true
          sudo ip tuntap del dev tap0 mode tap 2>/dev/null || true

      - name: Blackbox results summary
        if: always()
        run: |
          echo "## Blackbox Conformance Output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -c 12000 /tmp/blackbox.out >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "(no output captured)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── Blackbox validation: run same tests against Linux kernel reference SUT ──
  # If a test FAILS here, the test itself is wrong (not our stack).
  # If a test PASSES here but FAILS in blackbox-linux, our SUT has a bug.
  blackbox-validate:
    name: Blackbox — Validate Tests Against Linux Kernel (Reference SUT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip iproute2 socat

      - name: Install Python deps
        run: |
          sudo pip3 install --break-system-packages \
            -r tests/blackbox/requirements.txt \
            pytest-github-actions-annotate-failures

      - name: Set up veth pair + Linux reference SUT (kernel owns 10.0.0.2)
        run: |
          # Use a veth pair so scapy (on veth-test) can see ARP replies from
          # the kernel (on veth-sut).  A plain tap0 does not work here because
          # the kernel's TX frames go to the tap fd, not back to AF_PACKET.
          sudo ip link add veth-sut type veth peer name veth-test
          sudo ip link set veth-sut up
          sudo ip link set veth-test up
          sudo ip addr add 10.0.0.2/24 dev veth-sut   # Linux kernel IS the SUT
          sudo iptables -A OUTPUT -p tcp --tcp-flags RST RST -j DROP
          # TCP echo: socat works fine for stream sockets.
          sudo socat TCP-LISTEN:7,bind=10.0.0.2,fork,reuseaddr EXEC:'cat' &
          # UDP echo: socat EXEC:'cat' buffers (non-tty stdout is line-buffered
          # and cat never flushes), so datagrams are silently swallowed.
          # Single-line Python avoids YAML block-scalar indentation issues.
          sudo python3 -c "import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1); s.bind(('10.0.0.2',7)); exec('while 1:\n d,a=s.recvfrom(65535)\n s.sendto(d,a)')" &
          # Add a permanent neighbor entry for 10.0.0.100 (scapy phantom IP).
          # The kernel's ARP cache for a phantom IP expires ~15–30 s after the
          # initial ARP handshake.  Once it enters PROBE/FAILED the kernel can
          # no longer send ICMP/TCP/UDP replies to 10.0.0.100, causing all
          # response-based tests to fail.  A permanent entry never expires.
          OUR_MAC=$(cat /sys/class/net/veth-test/address)
          sudo ip neigh add 10.0.0.100 lladdr "$OUR_MAC" dev veth-sut nud permanent
          sleep 0.5

      - name: Run conformance suite against Linux reference SUT
        run: |
          # Skip sut_specific tests — they depend on our stack's timer values,
          # not on RFC correctness.  A failure here means the TEST is wrong.
          # Also skip test_dhcpv4_conform.py — it needs dhcp_echo_demo as SUT,
          # not the Linux kernel.
          sudo python3 -m pytest tests/blackbox/ \
            --ignore=tests/blackbox/test_tcp_fuzz.py \
            --ignore=tests/blackbox/test_dhcpv4_conform.py \
            --iface    veth-test \
            --sut-ip   10.0.0.2 \
            --our-ip   10.0.0.100 \
            --sut-port 7 \
            -m "not sut_specific" \
            -v \
            2>&1 | tee /tmp/validate.out
          exit ${PIPESTATUS[0]}

      - name: Teardown
        if: always()
        run: |
          sudo iptables -D OUTPUT -p tcp --tcp-flags RST RST -j DROP 2>/dev/null || true
          sudo ip link del veth-sut 2>/dev/null || true   # deletes both ends

      - name: Validation results summary
        if: always()
        run: |
          echo "## Reference-SUT Validation Output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -c 12000 /tmp/validate.out >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "(no output captured)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── DHCP client blackbox tests (TAP, Linux only) ──────────────────
  blackbox-dhcp:
    name: Blackbox — DHCPv4 Client Conformance (dhcp_echo_demo, TAP)
    runs-on: ubuntu-latest
    needs: cmake-linux
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip iproute2

      - name: Install Python deps
        run: |
          sudo pip3 install --break-system-packages \
            -r tests/blackbox/requirements.txt \
            pytest-github-actions-annotate-failures

      - name: Build dhcp_echo_demo
        run: |
          cmake -S . -B build
          cmake --build build --target dhcp_echo_demo

      - name: Set up TAP interface
        run: |
          sudo ip tuntap add dev tap0 mode tap user $(whoami)
          sudo ip link set tap0 up
          sudo ip addr add 10.0.0.100/24 dev tap0

      - name: Start DHCP SUT (dhcp_echo_demo)
        run: |
          sudo ./build/demo/dhcp_echo_demo > /tmp/dhcp_sut.log 2>&1 &
          echo $! > /tmp/dhcp_sut.pid
          sleep 1

      - name: Run DHCP client conformance suite
        run: |
          # --dhcp-sut-bin activates the dhcp_sut_fresh fixture which kills and
          # restarts dhcp_echo_demo before each test.  Without this, after the
          # first test_ack_binds_ip the SUT holds a bound IP and never sends
          # DISCOVER again, causing all subsequent tests to time out.
          sudo python3 -m pytest tests/blackbox/test_dhcpv4_conform.py \
            --iface           tap0                            \
            --our-ip          10.0.0.100                     \
            --dhcp-sut-mac    02:00:00:de:ad:01               \
            --dhcp-server-ip  10.0.0.1                        \
            --dhcp-offered-ip 10.0.0.50                       \
            --dhcp-sut-bin    ./build/demo/dhcp_echo_demo     \
            --dhcp-sut-pid-file /tmp/dhcp_sut.pid             \
            -p no:cacheprovider                               \
            --tb=short -v                                     \
            2>&1 | tee /tmp/dhcp_blackbox.out
          exit ${PIPESTATUS[0]}

      - name: Stop DHCP SUT and teardown TAP
        if: always()
        run: |
          [ -f /tmp/dhcp_sut.pid ] && sudo kill $(cat /tmp/dhcp_sut.pid) 2>/dev/null || true
          sudo ip tuntap del dev tap0 mode tap 2>/dev/null || true

      - name: DHCP results summary
        if: always()
        run: |
          echo "## DHCP Blackbox Output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -c 12000 /tmp/dhcp_blackbox.out >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo "(no output captured)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ── FetchContent integration test ───────────────────────────────────
  fetchcontent:
    name: FetchContent — Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure example consumer
        run: cmake -S examples/fetchcontent -B examples/fetchcontent/build
      - name: Build example consumer
        run: cmake --build examples/fetchcontent/build
      - name: Run example
        run: ./examples/fetchcontent/build/example_app
