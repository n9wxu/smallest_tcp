name: Fuzz — Nightly TCP Robustness

# Run nightly at 02:00 UTC and allow manual dispatch.
# Intentionally NOT triggered on push/PR — fuzz tests are slow.
on:
  schedule:
    - cron: "0 2 * * *"          # 02:00 UTC every night
  workflow_dispatch:
    inputs:
      fuzz_count:
        description: "Fuzz iterations per test (default 500)"
        required: false
        default: "500"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Scapy fuzz, once per Linux MAC driver (see tests/blackbox/sut_net.sh)
  fuzz-tcp-linux:
    name: Fuzz — TCP over ${{ matrix.label }} (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: tap, label: TAP }
          - { driver: raw, label: raw socket }

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-pip iproute2

      - name: Install Python deps
        run: sudo pip3 install --break-system-packages -r tests/blackbox/requirements.txt

      - name: Build tcp_echo_demo
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target tcp_echo_demo

      - name: Set up the SUT link (${{ matrix.label }})
        run: |
          set -o pipefail
          # --rst-drop: drop kernel RSTs so Scapy connections aren't torn
          # down by the host.  Exports TEST_IF / SUT_IF.
          sudo tests/blackbox/sut_net.sh up ${{ matrix.driver }} --rst-drop \
            | tee -a "$GITHUB_ENV"

      - name: Start tcp_echo_demo (SUT)
        run: |
          sudo ./build/demo/tcp_echo_demo "$SUT_IF" &
          echo $! > /tmp/sut.pid
          sleep 1

      - name: Run fuzz suite
        run: |
          FUZZ_COUNT=${{ github.event.inputs.fuzz_count || 500 }}
          cd tests/blackbox
          sudo python3 -m pytest test_tcp_fuzz.py      \
            --iface "$TEST_IF"                         \
            --sut-ip  10.0.0.2                         \
            --our-ip  10.0.0.100                       \
            --sut-port 7                               \
            --fuzz-count "$FUZZ_COUNT"                 \
            -v --tb=long                               \
            -p no:cacheprovider                        \
            2>&1

      - name: Full conformance suite post-fuzz (regression check — all protocols)
        run: |
          # Stop the fuzz SUT; run_blackbox.sh will start its own fresh
          # instance so the conformance suite begins from a clean LISTEN state.
          [ -f /tmp/sut.pid ] && sudo kill $(cat /tmp/sut.pid) 2>/dev/null || true
          sleep 1
          chmod +x tests/blackbox/run_blackbox.sh
          sudo tests/blackbox/run_blackbox.sh          \
            --sut-bin  ./build/demo/tcp_echo_demo      \
            --iface    "$TEST_IF"                      \
            --sut-iface "$SUT_IF"                      \
            --sut-ip   10.0.0.2                        \
            --our-ip   10.0.0.100                      \
            --sut-port 7                               \
            -v

      - name: Stop SUT and tear down the link
        if: always()
        run: |
          [ -f /tmp/sut.pid ] && sudo kill $(cat /tmp/sut.pid) || true
          sudo tests/blackbox/sut_net.sh down ${{ matrix.driver }}

  # ── Hardware DUT fuzz (self-hosted, conditional) ───────────────────
  # Runs only when a self-hosted runner with the `hw-dut` label is
  # registered and the variable HW_DUT_ENABLED is 'true'; skipped
  # otherwise.  The DUT is a NUCLEO-F429ZI (boards/nucleo-f429zi) cabled to
  # the runner's eth1 (10.0.0.100/24), its ST-LINK on USB: SWD for OpenOCD,
  # and the virtual COM port (HW_DUT_SERIAL, default /dev/ttyACM0) for the
  # firmware's "ready".  See docs/test-plan.md §4.
  fuzz-tcp-hw:
    name: Fuzz — TCP on Hardware DUT (NUCLEO-F429ZI)
    runs-on: [self-hosted, hw-dut]
    timeout-minutes: 90
    if: ${{ vars.HW_DUT_ENABLED == 'true' }}
    env:
      SERIAL: ${{ vars.HW_DUT_SERIAL || '/dev/ttyACM0' }}
      OPENOCD: openocd -f interface/stlink.cfg -f target/stm32f4x.cfg

    steps:
      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip3 install -r tests/blackbox/requirements.txt

      - name: Cross-compile the NUCLEO-F429ZI firmware
        run: |
          cmake -S . -B build-arm         \
            -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake \
            -DSMALLEST_TCP_BOARD=nucleo-f429zi \
            -DSMALLEST_TCP_TLS=OFF \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-arm --target tcp_echo_demo

      - name: Flash DUT via OpenOCD, and wait for its "ready"
        run: |
          stty -F "$SERIAL" 115200 raw -echo
          ( timeout 20 grep -q -m1 ready "$SERIAL" ) & watcher=$!
          $OPENOCD -c "program build-arm/tcp_echo_demo.elf verify reset exit"
          wait $watcher

      - name: Run fuzz suite on hardware
        run: |
          FUZZ_COUNT=${{ github.event.inputs.fuzz_count || 500 }}
          cd tests/blackbox
          sudo python3 -m pytest test_tcp_fuzz.py      \
            --iface eth1                               \
            --sut-ip  10.0.0.2                         \
            --our-ip  10.0.0.100                       \
            --sut-port 7                               \
            --fuzz-count "$FUZZ_COUNT"                 \
            -v --tb=long                               \
            2>&1

      - name: Reset DUT and run conformance (regression)
        if: always()
        run: |
          # A reset over SWD starts the firmware afresh; a board that no
          # longer answers SWD needs its power cycled by hand (or a relay)
          ( timeout 20 grep -q -m1 ready "$SERIAL" ) & watcher=$!
          $OPENOCD -c "init; reset run; exit"
          wait $watcher

          cd tests/blackbox
          sudo python3 -m pytest                       \
            test_arp_conform.py                        \
            test_ipv4_conform.py                       \
            test_icmp_conform.py                       \
            test_udp_conform.py                        \
            test_tcp_conform.py                        \
            --iface eth1                               \
            --sut-ip  10.0.0.2                         \
            --our-ip  10.0.0.100                       \
            --sut-port 7                               \
            -v --tb=short                              \
            -p no:cacheprovider                        \
            2>&1
