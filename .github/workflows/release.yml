name: Release

# Every push to main that passes CI is released.  When "CI — Build & Unit
# Tests" succeeds for a push to main, and main still points at the commit
# it tested, this job takes the next version (scripts/release.py next: the
# one in include/net_version.h if it has no tag yet, else its PATCH + 1),
# writes it into net_version.h, closes CHANGELOG.md's [Unreleased] section
# under it, commits "release: X.Y.Z" to main, tags that commit vX.Y.Z and
# publishes the GitHub Release.  A push made with the job's token starts no
# workflow, so the release commit does not release itself.
# See docs/release-process.md.

on:
  workflow_run:
    workflows: ["CI — Build & Unit Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Version, tag and publish
    # CI passed for a push to this repository's main — not a pull request,
    # whose branch may be called main too
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # the tags and the log since the last one

      - name: The commit CI tested is still main
        id: current
        env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$TESTED" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved past $TESTED: its own CI run releases it"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp the version
        id: version
        if: steps.current.outputs.release == 'true'
        run: |
          v=$(python3 scripts/release.py next)
          python3 scripts/release.py stamp "$v"
          python3 scripts/release.py notes "$v" > "$RUNNER_TEMP/notes.md"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          git diff --stat

      - name: Commit, tag and publish
        if: steps.current.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "release: $VERSION"
          git tag "v$VERSION"
          # Atomic: neither lands if main moved meanwhile
          git push --atomic origin HEAD:main "v$VERSION"
          gh release create "v$VERSION" --verify-tag \
            --title "smallest_tcp $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          {
            echo "## Released smallest_tcp $VERSION"
            echo
            echo "Tested commit \`${{ github.event.workflow_run.head_sha }}\`;"
            echo "tag \`v$VERSION\` on \`$(git rev-parse HEAD)\`."
          } >> "$GITHUB_STEP_SUMMARY"
